<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lam7a Connect</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one readable column; Arabic and English side by side on wide screens, stacked on phones */
:root{
  --bg:#F6F7F2; --fg:#14161A; --muted:#5C6168; --line:#DADDD3; --accent:#5E7F00; --chip:#C8FF2E; --ink:#0E0E10;
  --ar:"Cairo","Noto Kufi Arabic",Tahoma,sans-serif; --en:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1012; --fg:#ECEDE8; --muted:#9EA2A8; --line:#2A2C31; --accent:#C8FF2E; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0F1012; --fg:#ECEDE8; --muted:#9EA2A8; --line:#2A2C31; --accent:#C8FF2E; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font:16px/1.7 var(--en)}
.wrap{max-width:1100px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header svg{width:52px;height:52px;flex:none}
header h1{margin:0;font:800 28px/1.2 var(--ar)}
header p{margin:0;color:var(--muted);font-size:14px}
nav{display:flex;gap:10px;flex-wrap:wrap}
nav a{color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
nav a:focus-visible,nav a:hover{border-color:var(--accent);color:var(--accent);outline:none}
section{border-top:1px solid var(--line);padding-top:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
@media (max-width:760px){section{grid-template-columns:1fr;gap:24px}}
.en,.ar{min-width:0;max-width:65ch}
.ar{direction:rtl;font-family:var(--ar);text-align:right}
h2{margin:0 0 6px;font-size:22px;text-wrap:balance}
.ar h2{font-family:var(--ar);font-weight:800}
h3{margin:18px 0 4px;font-size:16px}
p,li{margin:0 0 8px}
ul{margin:0 0 8px;padding-inline-start:20px}
.meta{color:var(--muted);font-size:13px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
</style>

</head>
<body>
<div class="wrap">
  <header><div><h1>لمحة · Lam7a</h1><p>Account connected — copy this code back into the Lam7a studio.</p></div></header>
  <section style="display:block">
    <h2 id="st">Connection code</h2>
    <p class="meta">The code works for a few minutes only. Paste it into the studio's «ربط الحسابات» box.</p>
    <p><code id="code" style="display:block;word-break:break-all;font-size:15px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)">—</code></p>
    <p><button id="cp" type="button" style="font:600 15px var(--en);padding:10px 18px;border-radius:999px;border:0;background:#C8FF2E;color:#0E0E10;cursor:pointer">Copy code</button> <span id="ok" class="meta"></span></p>
  </section>
</div>
<script>
const q=new URLSearchParams(location.search), c=q.get("code"), e=q.get("error_description")||q.get("error");
document.getElementById("code").textContent = c || (e ? "Error: "+e : "No code in this link.");
if(!c) document.getElementById("cp").hidden = true;
document.getElementById("cp").addEventListener("click", async ()=>{ try{ await navigator.clipboard.writeText(c); document.getElementById("ok").textContent="Copied"; }catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById("code")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.getElementById("ok").textContent="Selected — press copy"; } });
</script>
</body>
</html>
